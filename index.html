<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redeem Akun Premium</title>
    <style>
        /* --- CSS: Desain Tampilan --- */
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #22c55e;
            --error-color: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Status Dot (Hijau/Merah) */
        .status-container {
            position: fixed; top: 20px; right: 20px;
            background: rgba(30, 41, 59, 0.9); padding: 8px 12px; border-radius: 20px;
            display: flex; align-items: center; gap: 8px; font-size: 0.8rem;
            border: 1px solid #334155; z-index: 1000;
        }
        .status-dot {
            width: 10px; height: 10px; border-radius: 50%; background-color: #64748b;
        }
        .status-dot.online { background-color: var(--success-color); box-shadow: 0 0 8px var(--success-color); }
        .status-dot.offline { background-color: var(--error-color); }
        .status-dot.blink { animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.4; } }

        /* Kartu Utama */
        .container {
            width: 100%; max-width: 400px; background: var(--card-bg);
            padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center; border-top: 4px solid var(--primary-color);
        }

        h1 { margin-bottom: 10px; }
        p.subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }

        /* Form & Tombol */
        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: var(--text-muted); }
        input {
            width: 100%; padding: 12px; background: #334155; border: 1px solid #475569;
            color: white; border-radius: 6px; outline: none;
        }
        button {
            width: 100%; padding: 12px; background: var(--primary-color); color: white;
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: var(--primary-hover); }
        button:disabled { background: #475569; cursor: not-allowed; }

        /* Area Hasil Akun */
        #result-area {
            margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 8px;
            border: 1px solid #334155; text-align: left; display: none; animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .account-row { margin-bottom: 10px; }
        .label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .value { font-family: monospace; background: #1e293b; padding: 5px; border-radius: 4px; display: block; word-break: break-all; }
        
        /* Toast Notifikasi */
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #333; color: white; padding: 10px 20px; border-radius: 20px;
            font-size: 0.9rem; opacity: 0; transition: 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; bottom: 30px; }
        .toast.success { background: var(--success-color); }
        .toast.error { background: var(--error-color); }

        /* Loader */
        .loader {
            display: none; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; border-top-color: white; animation: spin 1s linear infinite; margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Indikator Status -->
    <div class="status-container">
        <div id="status-dot" class="status-dot blink"></div>
        <span id="status-text">Cek Koneksi...</span>
    </div>

    <!-- Konten Utama -->
    <div class="container">
        <h1>Redeem Akun</h1>
        <p class="subtitle">Masukkan Kode Unik untuk claim akun.</p>

        <form id="redeem-form">
            <div class="input-group">
                <label for="code">Kode Redeem</label>
                <input type="text" id="code" placeholder="Masukkan kode..." required autocomplete="off">
            </div>
            
            <button type="submit" id="submit-btn">
                <span id="btn-text">Ambil Akun</span>
                <div class="loader"></div>
            </button>
        </form>

        <div id="result-area">
            <h3 style="color: var(--success-color); margin-bottom: 10px;">Berhasil!</h3>
            <div class="account-row">
                <div class="label">Email</div>
                <div class="value" id="res-email">...</div>
            </div>
            <div class="account-row">
                <div class="label">Password</div>
                <div class="value" id="res-pass">...</div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Pesan notifikasi</div>

    <!-- LOGIKA JAVASCRIPT -->
    <script type="module">
        // Import Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, doc, runTransaction, limit } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // ==========================================
        // PENTING: ISI KONFIGURASI FIREBASE ANDA
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCul8W17gn3ckp1_B6JFfhqYOPfexXilrY",
            authDomain: "fireba-fca1a.firebaseapp.com",
            projectId: "fireba-fca1a",
            storageBucket: "fireba-fca1a.firebasestorage.app",
            messagingSenderId: "1:507496403967:web:9fe048882aeffd84ae4dca",
            appId: "APP_ID"
        };

        // Element UI
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const form = document.getElementById('redeem-form');
        const btnText = document.getElementById('btn-text');
        const loader = document.querySelector('.loader');
        const submitBtn = document.getElementById('submit-btn');
        const resultArea = document.getElementById('result-area');

        let db;
        let isConnected = false;

        // Fungsi Ganti Status Warna
        function setStatus(type) {
            statusDot.className = 'status-dot';
            if (type === 'online') {
                statusDot.classList.add('online');
                statusText.innerText = "Terhubung";
                isConnected = true;
            } else if (type === 'offline') {
                statusDot.classList.add('offline', 'blink');
                statusText.innerText = "Gagal";
                isConnected = false;
            } else {
                statusDot.classList.add('blink');
                statusText.innerText = "Menghubungkan...";
            }
        }

        // Coba Koneksi
        setStatus('connecting');
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            // Tes koneksi ke database
            await getDocs(query(collection(db, "accounts"), limit(1)));
            setStatus('online');
        } catch (e) {
            console.error(e);
            setStatus('offline');
        }

        // Handle Tombol Submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isConnected) return showToast("Database belum terhubung", "error");

            const code = document.getElementById('code').value.trim();
            if (!code) return showToast("Isi kode dulu!", "error");

            setLoading(true);

            try {
                // 1. Cek Kode (Jika collection 'codes' ada)
                const qCode = query(collection(db, "codes"), where("code", "==", code), where("status", "==", "active"), limit(1));
                const snapCode = await getDocs(qCode);

                if (snapCode.empty) {
                    showToast("Kode salah atau kadaluarsa", "error");
                    setLoading(false);
                    return;
                }
                const codeRef = doc(db, "codes", snapCode.docs[0].id);

                // 2. Ambil Akun Random Active
                const qAcc = query(collection(db, "accounts"), where("status", "==", "active"), limit(50));
                const snapAcc = await getDocs(qAcc);

                if (snapAcc.empty) {
                    showToast("Stok akun habis!", "error");
                    setLoading(false);
                    return;
                }

                // Ambil random
                const list = [];
                snapAcc.forEach(d => list.push({id: d.id, data: d.data()}));
                const chosen = list[Math.floor(Math.random() * list.length)];

                // 3. Update Status (Akun & Kode)
                await runTransaction(db, async (t) => {
                    const accRef = doc(db, "accounts", chosen.id);
                    const accDoc = await t.get(accRef);
                    if(accDoc.data().status !== "active") throw "Sudah diambil";
                    
                    t.update(accRef, { status: "used" });
                    t.update(codeRef, { status: "used" });
                });

                // Tampilkan
                document.getElementById('res-email').innerText = chosen.data.email;
                document.getElementById('res-pass').innerText = chosen.data.password;
                resultArea.style.display = 'block';
                showToast("Sukses!", "success");
                form.reset();

            } catch (err) {
                console.error(err);
                showToast("Gagal mengambil akun", "error");
            } finally {
                setLoading(false);
            }
        });

        // Helper Functions
        function setLoading(load) {
            submitBtn.disabled = load;
            btnText.style.display = load ? 'none' : 'block';
            loader.style.display = load ? 'block' : 'none';
        }

        window.showToast = (msg, type) => {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = `toast show ${type}`;
            setTimeout(() => t.classList.remove('show'), 3000);
        };
    </script>
</body>
</html>
