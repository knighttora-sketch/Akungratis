<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redeem Akun (Fixed Path)</title>
    <style>
        :root {
            --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --text: #f8fafc;
            --success: #22c55e; --error: #ef4444; --muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        /* Status Dot */
        .status-box { position: fixed; top: 20px; right: 20px; background: rgba(30,41,59,0.9); padding: 8px 12px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-size: 0.8rem; border: 1px solid #334155; z-index: 100; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; }
        .dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .dot.offline { background: var(--error); }
        .dot.blink { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.4; } }

        /* Container */
        .container { width: 100%; max-width: 400px; background: var(--card); padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; border-top: 4px solid var(--primary); }
        h1 { margin-bottom: 10px; }
        .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
        
        /* Form */
        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: var(--muted); }
        input { width: 100%; padding: 12px; background: #334155; border: 1px solid #475569; color: white; border-radius: 6px; outline: none; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #475569; cursor: not-allowed; }

        /* Result Area */
        #result-area { margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; text-align: left; display: none; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .row { margin-bottom: 10px; }
        .label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
        .val { font-family: monospace; background: #1e293b; padding: 5px; border-radius: 4px; display: block; word-break: break-all; }

        /* Debug Tools */
        .debug-tools { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; }
        .debug-btn { background: rgba(255,255,255,0.1); color: #ccc; border: 1px solid #444; padding: 8px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; width: auto; }
        .debug-btn:hover { background: rgba(255,255,255,0.2); color: white; }
        
        #debug-console { display: none; position: fixed; bottom: 100px; right: 20px; width: 300px; max-height: 200px; background: rgba(0,0,0,0.9); color: #0f0; border: 1px solid #333; padding: 10px; font-family: monospace; font-size: 0.8rem; overflow-y: auto; border-radius: 6px; }
        .log-item { border-bottom: 1px solid #333; padding: 2px 0; }

        /* Toast */
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 20px; font-size: 0.9rem; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 200; }
        .toast.show { opacity: 1; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--error); }
        .toast.info { background: #3b82f6; }

        .loader { display: none; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Indikator Status -->
    <div class="status-box">
        <div id="status-dot" class="dot blink"></div>
        <span id="status-text">Connecting...</span>
    </div>

    <!-- Konten Utama -->
    <div class="container">
        <h1>Redeem Akun</h1>
        <p class="subtitle">Masukkan Kode Redeem</p>

        <form id="redeem-form">
            <div class="input-group">
                <label>Kode</label>
                <input type="text" id="code" placeholder="Contoh: VIP123" required autocomplete="off">
            </div>
            <button type="submit" id="submit-btn">
                <span id="btn-text">Ambil Akun</span>
                <div class="loader"></div>
            </button>
        </form>

        <div id="result-area">
            <h3 style="color:var(--success)">Berhasil!</h3>
            <div class="row"><div class="label">Email</div><div class="val" id="res-email">...</div></div>
            <div class="row"><div class="label">Pass</div><div class="val" id="res-pass">...</div></div>
        </div>
    </div>

    <!-- Tombol Debug -->
    <div class="debug-tools">
        <button class="debug-btn" onclick="window.checkDB()">1. Check Data</button>
        <button class="debug-btn" onclick="document.getElementById('debug-console').style.display = 'block'">2. Open Console</button>
    </div>
    
    <!-- Console Log -->
    <div id="debug-console"></div>

    <!-- Notifikasi -->
    <div id="toast" class="toast">Pesan</div>

    <!-- SCRIPT JAVASCRIPT (UPDATED & FIXED) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // ==========================================
        // PENTING: ISI KONFIGURASI FIREBASE ANDA
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCul8W17gn3ckp1_B6JFfhqYOPfexXilrY",
            authDomain: "fca1a.firebaseapp.com",
            databaseURL: "https://fireba-fca1a-default-rtdb.asia-southeast1.firebasedatabase.app", // PENTING: URL Database Realtime
            projectId: "fireba-fca1a",
            storageBucket: "fireba-fca1a.firebasestorage.app",
            messagingSenderId: "507496403967",
            appId: "1:507496403967:web:9fe048882aeffd84ae4dca"
        };

        let db;
        let isConnected = false;

        // Elements
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const form = document.getElementById('redeem-form');
        const btnText = document.getElementById('btn-text');
        const loader = document.querySelector('.loader');
        const submitBtn = document.getElementById('submit-btn');
        const resultArea = document.getElementById('result-area');
        const debugConsole = document.getElementById('debug-console');

        function log(msg) {
            const div = document.createElement('div');
            div.className = 'log-item';
            div.innerText = `> ${msg}`;
            debugConsole.prepend(div);
            console.log(msg);
        }

        // Init
        try {
            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);
            log("DB Initialized");

            get(ref(db)).then((snapshot) => {
                statusDot.className = 'dot online';
                statusText.innerText = "Online";
                isConnected = true;
                log("Connected");
            }).catch((e) => {
                statusDot.className = 'dot offline';
                statusText.innerText = "Offline";
                log(`Error: ${e.message}`);
            });

        } catch (e) {
            log(`Config Error: ${e.message}`);
        }

        // --- DEBUG FUNCTION ---
        window.checkDB = async () => {
            // Path sesuai scan terakhir: codes/accounts
            try {
                const snapshot = await get(ref(db, 'codes/accounts')); 
                if (snapshot.exists()) {
                    const all = snapshot.val();
                    let count = 0;
                    for (const k in all) {
                        // Hitung yang BUKAN 'used'
                        const s = all[k].status ? all[k].status.toLowerCase() : '';
                        if (s !== 'used') count++;
                    }
                    showToast(`Tersedia: ${count} akun`, count>0?"success":"error");
                    log(`Total Akun: ${Object.keys(all).length} | Siap Pakai: ${count}`);
                } else {
                    showToast("Data kosong", "error");
                }
            } catch (e) { log(e.message); }
        };

        // --- LOGIC REDEEM ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isConnected) return showToast("Database Offline", "error");

            const inputCode = document.getElementById('code').value.trim();
            if(!inputCode) return showToast("Isi kode", "error");

            setLoading(true);
            log(`Redeem attempt: ${inputCode}`);

            try {
                // 1. CEK KODE
                const snapCode = await get(ref(db, 'codes'));
                let codeKey = null;
                
                if (snapCode.exists()) {
                    const data = snapCode.val();
                    // Loop mencari kode di dalam node 'codes'
                    for (const key in data) {
                        // Lewati node 'accounts' karena itu tempat stok akun
                        if (key === 'accounts') continue;

                        const item = data[key];
                        // Cek kode (Case Insensitive) & Status (Case Insensitive)
                        if (item.code && item.code.toLowerCase() === inputCode.toLowerCase() && 
                            item.status && item.status.toLowerCase() === 'active') {
                            codeKey = key; 
                            break;
                        }
                    }
                }

                if (!codeKey) {
                    log("Kode tidak valid/sudah dipakai");
                    showToast("Kode Salah/Used", "error");
                    setLoading(false);
                    return;
                }

                log("Kode Valid. Mencari Akun...");

                // 2. AMBIL AKUN
                // Path sesuai scan: codes/accounts
                const snapAcc = await get(ref(db, 'codes/accounts'));
                let availableAccounts = [];

                if (snapAcc.exists()) {
                    const allAcc = snapAcc.val();
                    for (const k in allAcc) {
                        const item = allAcc[k];
                        // LOGIKA BARU: Ambil jika status TIDAK SAMA DENGAN 'used'
                        const status = item.status ? item.status.toLowerCase() : '';
                        
                        if (status !== 'used') {
                            availableAccounts.push({ key: k, data: item });
                        }
                    }
                }

                log(`Ditemukan ${availableAccounts.length} akun siap pakai.`);

                if (availableAccounts.length === 0) {
                    showToast("Stok Akun Habis (Semua Used)", "error");
                    setLoading(false);
                    return;
                }

                // 3. RANDOM & UPDATE
                const pick = availableAccounts[Math.floor(Math.random() * availableAccounts.length)];
                
                log(`Mengambil Akun: ${pick.data.email}`);

                // Update Kode (di path codes/Afton)
                await update(ref(db, 'codes/' + codeKey), { status: 'used' });
                
                // Update Akun (di path codes/accounts/key)
                await update(ref(db, 'codes/accounts/' + pick.key), { status: 'used' });

                // 4. SUKSES
                document.getElementById('res-email').innerText = pick.data.email;
                document.getElementById('res-pass').innerText = pick.data.password;
                resultArea.style.display = 'block';
                showToast("Berhasil!", "success");
                form.reset();
                log("Proses Selesai");

            } catch (err) {
                console.error(err);
                log(`System Error: ${err.message}`);
                showToast("Terjadi kesalahan", "error");
            } finally {
                setLoading(false);
            }
        });

        function setLoading(l) {
            submitBtn.disabled = l;
            btnText.style.display = l ? 'none' : 'block';
            loader.style.display = l ? 'block' : 'none';
        }

        window.showToast = (msg, type) => {
            const t = document.getElementById('toast');
            t.innerText = msg; t.className = `toast show ${type}`;
            setTimeout(() => t.classList.remove('show'), 3000);
        };
    </script>
</body>
</html>
